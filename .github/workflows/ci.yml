# CI for Spectral Canary Works. ENABLED: the owner turned GitHub Actions on on 2026-11-09, and the repo is public
# (standard GitHub-hosted runners are free for public repos). It runs on pull requests and manual dispatch, not on
# every push. Every job here also runs locally: `make ci` (lint, types, fixtures,
# contract, tests incl. e2e failure->rollback, chaos replay, web build), `make iac-validate`, `make docker-build`.
# No secrets are required by any job.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"

jobs:
  python:
    name: lint, types, fixtures, contract, tests (incl. e2e rollback), chaos replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.12.23"}
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests && uv run --frozen ruff format --check src tests
      - run: uv run --frozen mypy
      - name: train fixtures (fails if dataset/prediction hashes differ from committed manifests)
        run: uv run --frozen scw train-fixtures
      - name: model_artifact_v1 contract + schema compatibility
        run: uv run --frozen python scripts/check_contract.py
      - name: tests (unit, API contract, e2e failure->rollback over real HTTP)
        run: uv run --frozen pytest -q
      - name: chaos replay (seeded fault suite with expected outcomes)
        run: uv run --frozen scw chaos-replay
      - name: reproducible dry-run release (demo, in-process)
        run: uv run --frozen scw demo --in-process
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: run-reports, path: "var/runs/*/report.json", retention-days: 7}

  security:
    name: dependency + secret + image scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.12.23"}
      - run: uv sync --frozen
      - name: pip-audit (Python dependencies, from the lockfile)
        run: uv export --frozen --no-hashes --no-emit-project --format requirements-txt > /tmp/req.txt && uv run --frozen pip-audit -r /tmp/req.txt --strict
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: npm audit (web, production deps)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high
      - name: trivy filesystem scan (vulns + misconfig in Dockerfiles/IaC)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.57.1 fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 /src

  web:
    name: web typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - working-directory: web
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build

  image:
    name: docker build + container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build (the builder stage retrains fixtures and verifies hashes)
        run: docker build -t spectral-canary-works:ci .
      - name: "smoke: readiness, a real prediction, version header, metrics"
        run: |
          docker run -d --name scw -p 5120:5120 --read-only --tmpfs /tmp spectral-canary-works:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5120/readyz && break; sleep 2; done
          curl -fsS -D /tmp/h -X POST http://127.0.0.1:5120/v1/predict -H 'content-type: application/json' \
            -d '{"request_key":"ci-1","features":{"amount":42.5,"merchant_category":"grocery","hour_of_day":12,"account_age_days":900,"txn_count_24h":2,"distance_from_home_km":3.2,"device_trust_score":0.9,"card_present":true,"country_mismatch":false}}'
          grep -i '^x-model-version: v1-logreg' /tmp/h
          curl -fsS http://127.0.0.1:5120/metrics | grep scw_requests_total
          docker logs scw | tail -20
      - name: image scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --severity CRITICAL --exit-code 1 spectral-canary-works:ci

  iac:
    name: OpenTofu fmt + validate (no plan, no apply, no cloud credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/iac_validate.sh

  changes:
    # Decides whether the LLM gate below needs to run, so its Ollama service container only starts when it is used.
    name: detect LLM-lane changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists the PR's changed files through the API
    outputs:
      llm: ${{ steps.filter.outputs.llm }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            llm:
              - 'configs/llm/**'
              - 'evals/triage/**'
              - 'src/spectral_canary/llm/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  llm-gate:
    # Prompt/model regression gate for the LLM triage lane: promptfoo against a local Ollama service, failing below the
    # pass-rate threshold in the Makefile. Runs on pull requests that change the lane's prompts, bundles, policy, gold
    # set, code, the Makefile or this workflow, and on manual dispatch. On a GitHub-hosted runner the 3B model runs on
    # CPU. The image is pinned by digest to Ollama 0.40.13, the version on the build machine; recorded local gate
    # output is under docs/evidence/llm/promptfoo/.
    name: LLM triage regression gate (promptfoo, local Ollama, pass-rate threshold)
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.llm == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      ollama:
        image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
        ports: ["11434:11434"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22.22", cache: npm, cache-dependency-path: evals/triage/package-lock.json}
      - name: pull the pinned model tag
        run: curl -fsS http://127.0.0.1:11434/api/pull -d '{"model":"llama3.2:3b","stream":false}'
      - name: promptfoo eval (fails below the pass-rate threshold)
        run: make llm-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: promptfoo-results, path: "evals/triage/results/", retention-days: 7}

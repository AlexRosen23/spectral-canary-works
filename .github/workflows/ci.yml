# CI for Spectral Canary Works. ENABLED: the owner turned GitHub Actions on on 2026-11-09, and the repo is public
# (standard GitHub-hosted runners are free for public repos). It runs on pull requests and manual dispatch, not on
# every push. Every job here also runs locally: `make ci` (lint, types, fixtures,
# contract, tests incl. e2e failure->rollback, chaos replay, web build), `make iac-validate`, `make docker-build`,
# `make llm-gate-relative`. No secrets are required by any job.
name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      llm_gate_base_ref:
        description: "llm-gate: branch, tag or SHA to compare the dispatched ref against"
        required: false
        default: "main"
      llm_gate_head_prompt:
        description: "llm-gate: optional prompt for the head run (e.g. triage-p3, the regressed prompt, to see the gate fail)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"

jobs:
  python:
    name: lint, types, fixtures, contract, tests (incl. e2e rollback), chaos replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.12.23"}
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests && uv run --frozen ruff format --check src tests
      - run: uv run --frozen mypy
      - name: train fixtures (fails if dataset/prediction hashes differ from committed manifests)
        run: uv run --frozen scw train-fixtures
      - name: model_artifact_v1 contract + schema compatibility
        run: uv run --frozen python scripts/check_contract.py
      - name: tests (unit, API contract, e2e failure->rollback over real HTTP)
        run: uv run --frozen pytest -q
      - name: chaos replay (seeded fault suite with expected outcomes)
        run: uv run --frozen scw chaos-replay
      - name: reproducible dry-run release (demo, in-process)
        run: uv run --frozen scw demo --in-process
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: run-reports, path: "var/runs/*/report.json", retention-days: 7}

  security:
    name: dependency + secret + image scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.12.23"}
      - run: uv sync --frozen
      - name: pip-audit (Python dependencies, from the lockfile)
        run: uv export --frozen --no-hashes --no-emit-project --format requirements-txt > /tmp/req.txt && uv run --frozen pip-audit -r /tmp/req.txt --strict
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: npm audit (web, production deps)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high
      - name: trivy filesystem scan (vulns + misconfig in Dockerfiles/IaC)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.57.1 fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 /src

  web:
    name: web typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - working-directory: web
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build

  image:
    name: docker build + container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build (the builder stage retrains fixtures and verifies hashes)
        run: docker build -t spectral-canary-works:ci .
      - name: "smoke: readiness, a real prediction, version header, metrics"
        run: |
          docker run -d --name scw -p 5120:5120 --read-only --tmpfs /tmp spectral-canary-works:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5120/readyz && break; sleep 2; done
          curl -fsS -D /tmp/h -X POST http://127.0.0.1:5120/v1/predict -H 'content-type: application/json' \
            -d '{"request_key":"ci-1","features":{"amount":42.5,"merchant_category":"grocery","hour_of_day":12,"account_age_days":900,"txn_count_24h":2,"distance_from_home_km":3.2,"device_trust_score":0.9,"card_present":true,"country_mismatch":false}}'
          grep -i '^x-model-version: v1-logreg' /tmp/h
          curl -fsS http://127.0.0.1:5120/metrics | grep scw_requests_total
          docker logs scw | tail -20
      - name: image scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --severity CRITICAL --exit-code 1 spectral-canary-works:ci

  iac:
    name: OpenTofu fmt + validate (no plan, no apply, no cloud credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/iac_validate.sh

  changes:
    # Decides whether llm-gate needs to run on a pull request, so its Ollama service container starts only when used.
    name: detect LLM-lane changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists the PR's changed files through the API
    outputs:
      llm: ${{ steps.filter.outputs.llm }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            llm:
              - 'configs/llm/**'
              - 'evals/triage/**'
              - 'src/spectral_canary/llm/**'
              - 'scripts/llm_gate_*'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  llm-gate:
    # Prompt/model regression gate for the LLM triage lane, RELATIVE to the PR base. It checks out the base
    # (github.base_ref) next to the PR head, runs the promptfoo suite (evals/triage/) for both against the same Ollama
    # service on this runner, and fails when the head's pass rate drops more than the release policy's margin below the
    # base's: 100 * 0.05 (max_escalation_recall_drop) * 66/150 must-escalate cases = 2.2 points (scripts/llm_gate_compare.py).
    # Why relative: the absolute 90% threshold of `make llm-gate` was calibrated on Apple Metal (champion 139/150 = 92.7%);
    # here the same weights, Ollama 0.40.13, prompt, params and seed run on the CPU backend and score 127/150 = 84.7%
    # (run 42692611563, docs/evidence/llm/promptfoo/triage-p2.github-cpu.*). Greedy decoding is not bit-identical across
    # backends, but both runs of one job share a backend. Runs on PRs that touch the LLM lane, and on manual dispatch
    # (compares the dispatched ref with `llm_gate_base_ref`, default main).
    name: LLM triage regression gate (promptfoo, local Ollama, PR head vs base on one runner)
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.llm == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      ollama:
        image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
        ports: ["11434:11434"]
    steps:
      - name: check out the PR head (the merge result on pull_request)
        uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: check out the comparison base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.llm_gate_base_ref }}
          path: .llm-gate-base
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: |
            evals/triage/package-lock.json
            .llm-gate-base/evals/triage/package-lock.json
      - name: pull the pinned model tag
        run: |
          curl -fsS http://127.0.0.1:11434/api/pull -d '{"model":"llama3.2:3b","stream":false}'
          echo; curl -fsS http://127.0.0.1:11434/api/version
          echo; curl -fsS http://127.0.0.1:11434/api/tags | python3 -c 'import json,sys; [print(m["name"], m["digest"]) for m in json.load(sys.stdin)["models"]]'
      - name: promptfoo eval, base then head (fails if head drops more than the margin below base)
        env:
          LLM_GATE_BASE_DIR: .llm-gate-base
          LLM_GATE_HEAD_PROMPT: ${{ inputs.llm_gate_head_prompt }}
          PYTHON: python3
          BASE_LABEL: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.llm_gate_base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "base: $BASE_LABEL; head: $GITHUB_REF${PR_HEAD_SHA:+ (PR head $PR_HEAD_SHA, merged into the base)}"
          make llm-gate-relative
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: promptfoo-results, path: "evals/triage/results/", retention-days: 7}

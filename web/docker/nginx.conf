server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:5120 http://localhost:5120; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
  location / { try_files $uri /index.html; }
}

[project]
name = "spectral-canary-works"
version = "0.1.0"
description = "Local ML release and reliability lab: registry, gates, shadow, canary, drift, chaos replay and audited rollback."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "skops>=0.10",
  "prometheus-client>=0.20",
  "psutil>=6.0",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-prometheus>=0.66b2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.23",
  "pip-audit>=2.7",
  "pyyaml>=6.0",
]

[project.scripts]
scw = "spectral_canary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectral_canary"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "e2e: end-to-end release scenarios (slower)",
]

[tool.mypy]
python_version = "3.12"
packages = ["spectral_canary"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
